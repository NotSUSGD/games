<!DOCTYPE html>
<html lang="en-us">
<head>
    <base href="https://cdn.jsdelivr.net/gh/web-ports/clover-pit@main/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>CloverPit</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
        #sidebarad1,
        #sidebarad2 {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 160px;
            height: 600px;
            padding: 0;
            margin: 0;
            z-index: 999999;
        }

        #sidebarad1 {
            left: 0;
        }

        #sidebarad2 {
            right: 0;
        }

        .sidebar-close {
            position: absolute;
            top: 0;
            right: 0;
            width: 22px;
            height: 22px;
            line-height: 22px;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
            z-index: 10;
        }

        .sidebar-frame {
            width: 160px;
            height: 600px;
            border: none;
            display: block;
        }
    </style>
</head>

<body>
    <div
        id="loading-text"
        style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;"
    >
        LOADING...
    </div>

    <div id="unity-container">
        <canvas
            id="unity-canvas"
            width="960"
            height="540"
            tabindex="-1"
        ></canvas>

        <div id="unity-loading-bar">
            <div id="unity-logo"></div>

            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>

        <div id="unity-warning"></div>
    </div>

    <script>
        const loadingText = document.querySelector("#loading-text");

        let totalBytes = 0;
        let loadedBytes = 0;

        async function fetchWithProgress(url) {
            const response = await fetch(url);
            const reader = response.body.getReader();

            const chunks = [];
            let received = 0;

            while (true) {
                const { done, value } = await reader.read();

                if (done) break;

                received += value.length;
                loadedBytes += value.length;
                chunks.push(value);

                const mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
                const mbTotal = "86.96";

                loadingText.textContent =
                    `LOADING... ${mbDone} MB / ${mbTotal} MB`;
            }

            const fullBuffer = new Uint8Array(received);
            let offset = 0;

            for (const chunk of chunks) {
                fullBuffer.set(chunk, offset);
                offset += chunk.length;
            }

            return fullBuffer.buffer;
        }

        async function mergeFiles(fileParts, cacheKey) {
            const buffers = await Promise.all(
                fileParts.map(part => fetchWithProgress(part))
            );

            const mergedBlob = new Blob(buffers);

            return URL.createObjectURL(mergedBlob);
        }

        function getParts(file, start, end) {
            const parts = [];

            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }

            return parts;
        }

        (async () => {
            const [dataUrl, wasmUrl] = await Promise.all([
                mergeFiles(
                    getParts("Build/CloverPit.data", 1, 3),
                    "CloverPit.data"
                ),
                mergeFiles(
                    getParts("Build/CloverPit.wasm", 1, 3),
                    "CloverPit.wasm"
                )
            ]);

            const container = document.querySelector("#unity-container");
            const canvas = document.querySelector("#unity-canvas");
            const loadingBar = document.querySelector("#unity-loading-bar");
            const progressBarFull = document.querySelector(
                "#unity-progress-bar-full"
            );
            const warningBanner = document.querySelector("#unity-warning");

            // Displays Unity warning or error banners.
            function unityShowBanner(msg, type) {
            }

            const buildUrl = "Build";
            const loaderUrl = buildUrl + "/CloverPit.loader.js";

            const config = {
                arguments: [],
                dataUrl: dataUrl,
                frameworkUrl: buildUrl + "/CloverPit.framework.js",
                codeUrl: wasmUrl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Panik Arcade",
                productName: "CloverPit",
                productVersion: "1.3",
                showBanner: unityShowBanner
            };

            // Configure the viewport for mobile devices.
            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                const meta = document.createElement("meta");

                meta.name = "viewport";
                meta.content =
                    "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";

                document.head.appendChild(meta);
            }

            loadingBar.style.display = "block";

            const script = document.createElement("script");
            script.src = loaderUrl;

            script.onload = () => {
                createUnityInstance(
                    canvas,
                    config,
                    (progress) => {
                        progressBarFull.style.width =
                            100 * progress + "%";
                    }
                )
                    .then((unityInstance) => {
                        loadingBar.style.display = "none";
                        loadingText.remove();
                    })
                    .catch((message) => {
                    });
            };

            document.body.appendChild(script);
        })();
    </script>

    <div id="sidebarad1">
        <div
            class="sidebar-close"
            onclick="this.parentElement.style.display='none'"
        >
            ✕
        </div>
    </div>

    <div id="sidebarad2">
        <div
            class="sidebar-close"
            onclick="this.parentElement.style.display='none'"
        >
            ✕
        </div>
    </div>
</body>
</html>
